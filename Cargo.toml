[package]
name = "waiting_zones"
version = "0.2.0"
edition = "2024"

# Experimental OSM-only generator: derives waiting zones straight from an
# OpenStreetMap extract, with no SUMO network in between.

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
quick-xml = "0.42"
# Polygon union/difference/area/containment on every zone polygon.
geo = { version = "0.33.1", default-features = false }
# Stroke-offsets a polyline into a polygon with real joins at each bend.
# Pinned to the exact version `geo` 0.33.1 resolves so Cargo unifies them.
i_overlay = { version = "=4.5.2", default-features = false }
geojson = { version = "1.0.0", default-features = false }
serde_json = "1.0.151"
serde = { version = "1", features = ["derive"] }
# Content hashes of the network files a reader must co-load, so a mixed set
# (one file from an older run) is detected instead of silently used.
sha2 = "0.10.9"
